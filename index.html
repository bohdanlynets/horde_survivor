<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horde Survivor</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;overflow:hidden;background:#101522;color:#fff;font-family:Arial,sans-serif}
  canvas{display:block}
  .screen{
    position:fixed;inset:0;z-index:10;display:flex;align-items:center;
    justify-content:center;background:rgba(4,7,13,.84)
  }
  .panel{
    width:min(920px,calc(100% - 28px));padding:28px;border-radius:18px;
    background:rgba(16,21,34,.97);border:1px solid #ffffff2b;
    text-align:center;box-shadow:0 20px 80px #0009
  }
  h1{margin:0 0 10px;color:#62e6a5;letter-spacing:4px;text-transform:uppercase}
  h2{margin:4px 0 20px}
  p{color:#adb8cc}
  button{
    border:0;border-radius:10px;padding:13px 20px;background:#62e6a5;
    color:#08110d;font-weight:bold;cursor:pointer
  }
  button:hover{filter:brightness(1.12);transform:translateY(-2px)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
  .card{
    min-height:170px;padding:20px;text-align:left;color:#fff;
    background:linear-gradient(145deg,#253149,#151b2a);
    border:1px solid #ffffff26;border-radius:14px;cursor:pointer;
    transition:.18s
  }
  .card:hover{border-color:#62e6a5;background:#263d43}
  .card strong{display:block;color:#ffd166;font-size:18px;margin-bottom:12px}
  .card span{color:#adb8cc;line-height:1.5}
  #hud{
    position:fixed;z-index:3;top:12px;left:12px;right:12px;
    display:flex;justify-content:space-between;gap:10px;pointer-events:none;
    font-weight:bold;text-shadow:0 2px 3px #000
  }
  .group{display:flex;flex-wrap:wrap;gap:8px}
  .stat{padding:8px 10px;border-radius:8px;background:#05080fb8;border:1px solid #ffffff20}
  #help{
    position:fixed;z-index:3;bottom:10px;left:50%;transform:translateX(-50%);
    color:#b7c1d2;font-size:13px;text-align:center;pointer-events:none
  }
  .hidden{display:none}
  @media(max-width:720px){.cards{grid-template-columns:1fr}.card{min-height:0}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="group">
    <div class="stat">HP: <span id="hp">10</span></div>
    <div class="stat">Damage: <span id="damage">1</span></div>
    <div class="stat">Bullets: <span id="bulletCount">1</span></div>
    <div class="stat">Score: <span id="score">0</span></div>
    <div class="stat">Enemies: <span id="enemyCount">0</span>/100</div>
  </div>
  <div class="group">
    <div class="stat">Skill: <span id="skillName">None</span></div>
    <div class="stat">Time: <span id="time">0:00</span></div>
  </div>
</div>

<div id="help" class="hidden">
  Move with WASD or arrow keys. Weapons fire automatically.
</div>

<section id="startScreen" class="screen">
  <div class="panel">
    <h1>Horde Survivor</h1>
    <p>Choose a starting skill.</p>
    <div class="cards">
      <button class="card" data-skill="vitality">
        <strong>1 — Vitality</strong>
        <span>Every 50 points, gain 1 HP and 1 damage. HP can exceed maximum HP.</span>
      </button>
      <button class="card" data-skill="rapid">
        <strong>2 — Overclock</strong>
        <span>At 300 points, permanently double your weapon's fire rate.</span>
      </button>
      <button class="card" data-skill="chaos">
        <strong>3 — Chaos Cannon</strong>
        <span>Quadruple fire rate and damage, but bullets shoot in random directions.</span>
      </button>
    </div>
  </div>
</section>

<section id="upgradeScreen" class="screen hidden">
  <div class="panel">
    <h1>Upgrade Available</h1>
    <p>Choose one upgrade. The game is paused until you choose.</p>
    <div class="cards">
      <button class="card upgrade" data-upgrade="damage">
        <strong>Power Shot</strong>
        <span>Increase damage by 5.</span>
      </button>
      <button class="card upgrade" data-upgrade="bullets">
        <strong>Multishot</strong>
        <span>Fire one additional bullet per attack. Bullets spread in different directions.</span>
      </button>
      <button class="card upgrade" data-upgrade="health">
        <strong>Vital Boost</strong>
        <span>Gain 10 HP. This can increase HP beyond maximum HP.</span>
      </button>
    </div>
  </div>
</section>

<section id="gameOverScreen" class="screen hidden">
  <div class="panel">
    <h1>Game Over</h1>
    <h2>Final score: <span id="finalScore">0</span></h2>
    <p id="finalStats"></p>
    <button id="restartButton">Choose Another Skill</button>
  </div>
</section>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const upgradeScreen = document.getElementById("upgradeScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const hud = document.getElementById("hud");
const help = document.getElementById("help");

const hpEl = document.getElementById("hp");
const damageEl = document.getElementById("damage");
const bulletCountEl = document.getElementById("bulletCount");
const scoreEl = document.getElementById("score");
const enemyCountEl = document.getElementById("enemyCount");
const skillNameEl = document.getElementById("skillName");
const timeEl = document.getElementById("time");
const finalScoreEl = document.getElementById("finalScore");
const finalStatsEl = document.getElementById("finalStats");

let width = innerWidth;
let height = innerHeight;
let animationId;
let lastTime = 0;
let elapsed = 0;
let running = false;
let paused = false;

const keys = {};
const bullets = [];
const enemies = [];
const particles = [];

const mouse = {x: width / 2, y: height / 2};

const player = {
  x: width / 2,
  y: height / 2,
  radius: 16,
  speed: 245,
  hp: 10,
  maxHp: 10,
  damage: 1,
  bulletCount: 1,
  fireCooldown: 0,
  fireRate: .24
};

const game = {
  score: 0,
  kills: 0,
  skill: null,
  nextSpawn: 0,
  nextUpgrade: 1000,
  rapidActivated: false,
  vitalityMilestone: 0
};

const skillNames = {
  vitality: "Vitality",
  rapid: "Overclock",
  chaos: "Chaos Cannon"
};

const enemyTypes = {
  small:  {hp:2,  speed:105, radius:11, damage:1, points:5,  color:"#72d6ff"},
  medium: {hp:6,  speed:68,  radius:17, damage:1, points:10, color:"#ffbd69"},
  large:  {hp:20, speed:36, radius:27, damage:2, points:20, color:"#ff5d73"}
};

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  width = innerWidth;
  height = innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (!running) {
    player.x = width / 2;
    player.y = height / 2;
  }
}

function resetGame(skill) {
  running = true;
  paused = false;
  elapsed = 0;

  game.score = 0;
  game.kills = 0;
  game.skill = skill;
  game.nextSpawn = 0;
  game.nextUpgrade = 1000;
  game.spawnMultiplier = 1;
  game.enemyCapIncrease = 0;
  game.rapidActivated = false;
  game.vitalityMilestone = 0;

  player.x = width / 2;
  player.y = height / 2;
  player.hp = 10;
  player.maxHp = 10;
  player.damage = skill === "chaos" ? 4 : 1;
  player.bulletCount = 1;
  player.fireCooldown = 0;
  player.fireRate = .24;

  bullets.length = 0;
  enemies.length = 0;
  particles.length = 0;

  startScreen.classList.add("hidden");
  upgradeScreen.classList.add("hidden");
  gameOverScreen.classList.add("hidden");
  hud.classList.remove("hidden");
  help.classList.remove("hidden");

  skillNameEl.textContent = skillNames[skill];
  updateHud();

  lastTime = performance.now();
  cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  paused = false;
  finalScoreEl.textContent = game.score;
  finalStatsEl.textContent =
    `You survived ${formatTime(elapsed)} and defeated ${game.kills} enemies.`;
  hud.classList.add("hidden");
  help.classList.add("hidden");
  upgradeScreen.classList.add("hidden");
  gameOverScreen.classList.remove("hidden");
}

function formatTime(seconds) {
  return `${Math.floor(seconds / 60)}:${Math.floor(seconds % 60)
    .toString().padStart(2, "0")}`;
}

function updateHud() {
  hpEl.textContent = Math.ceil(Math.max(0, player.hp));
  damageEl.textContent = player.damage;
  bulletCountEl.textContent = player.bulletCount;
  scoreEl.textContent = game.score;
  enemyCountEl.textContent = enemies.length;
  timeEl.textContent = formatTime(elapsed);
}

function randomEdgePosition() {
  const side = Math.floor(Math.random() * 4);
  const margin = 50;

  if (side === 0) return {x: Math.random() * width, y: -margin};
  if (side === 1) return {x: width + margin, y: Math.random() * height};
  if (side === 2) return {x: Math.random() * width, y: height + margin};
  return {x: -margin, y: Math.random() * height};
}

function chooseEnemyType() {
  const roll = Math.random();
  const largeChance = Math.min(.18, elapsed / 2400);
  const mediumChance = Math.min(.40, .30 + elapsed / 1800);

  if (roll < largeChance) return "large";
  if (roll < largeChance + mediumChance) return "medium";
  return "small";
}

function spawnEnemy() {
  if (enemies.length >= 100) return;

  const type = chooseEnemyType();
  const stats = enemyTypes[type];
  const position = randomEdgePosition();

  enemies.push({
    x: position.x,
    y: position.y,
    type,
    hp: stats.hp,
    maxHp: stats.hp,
    speed: stats.speed * (1 + elapsed / 6000),
    radius: stats.radius,
    damage: stats.damage,
    points: stats.points,
    color: stats.color,
    hitFlash: 0
  });
}

function getFireRate() {
  let rate = player.fireRate;

  if (game.skill === "rapid" && game.rapidActivated) rate /= 2;
  if (game.skill === "chaos") rate /= 4;

  return rate;
}

function getClosestEnemy() {
  let target = null;
  let distance = Infinity;

  for (const enemy of enemies) {
    const current = Math.hypot(enemy.x - player.x, enemy.y - player.y);
    if (current < distance) {
      distance = current;
      target = enemy;
    }
  }

  return target;
}

function shoot() {
  const target = getClosestEnemy();
  let baseAngle;

  if (game.skill === "chaos") {
    baseAngle = Math.random() * Math.PI * 2;
  } else if (target) {
    baseAngle = Math.atan2(target.y - player.y, target.x - player.x);
  } else {
    baseAngle = Math.random() * Math.PI * 2;
  }

  const spread = Math.min(1.1, .18 * (player.bulletCount - 1));

  for (let i = 0; i < player.bulletCount; i++) {
    let angle;

    if (game.skill === "chaos") {
      // Every Chaos Cannon bullet gets its own random direction.
      angle = Math.random() * Math.PI * 2;
    } else if (player.bulletCount === 1) {
      angle = baseAngle;
    } else {
      const position = i / (player.bulletCount - 1) - .5;
      angle = baseAngle + position * spread;
    }

    const speed = 720;

    bullets.push({
      x: player.x + Math.cos(angle) * 22,
      y: player.y + Math.sin(angle) * 22,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: game.skill === "chaos" ? 5 : 4,
      damage: player.damage,
      life: 1.2,
      color: game.skill === "chaos" ? "#ff5cff" : "#f7f2b0"
    });
  }
}

function updatePlayer(dt) {
  let dx = 0;
  let dy = 0;

  if (keys.w || keys.arrowup) dy--;
  if (keys.s || keys.arrowdown) dy++;
  if (keys.a || keys.arrowleft) dx--;
  if (keys.d || keys.arrowright) dx++;

  if (dx || dy) {
    const length = Math.hypot(dx, dy);
    player.x += dx / length * player.speed * dt;
    player.y += dy / length * player.speed * dt;
  }

  player.x = Math.max(player.radius, Math.min(width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(height - player.radius, player.y));

  player.fireCooldown -= dt;

  if (player.fireCooldown <= 0) {
    shoot();
    player.fireCooldown = getFireRate();
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bullet = bullets[i];

    bullet.x += bullet.vx * dt;
    bullet.y += bullet.vy * dt;
    bullet.life -= dt;

    if (
      bullet.life <= 0 ||
      bullet.x < -30 || bullet.x > width + 30 ||
      bullet.y < -30 || bullet.y > height + 30
    ) {
      bullets.splice(i, 1);
      continue;
    }

    for (let j = enemies.length - 1; j >= 0; j--) {
      const enemy = enemies[j];
      const distance = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);

      if (distance < bullet.radius + enemy.radius) {
        enemy.hp -= bullet.damage;
        enemy.hitFlash = .08;
        bullets.splice(i, 1);
        createParticles(bullet.x, bullet.y, enemy.color, 4);

        if (enemy.hp <= 0) {
          game.score += enemy.points;
          game.kills++;
          createParticles(enemy.x, enemy.y, enemy.color, 16);

          // Remove only this specific enemy.
          enemies.splice(j, 1);

          applyScoreSkills();
          checkForUpgrade();
        }

        break;
      }
    }
  }
}

function applyScoreSkills() {
  if (game.skill === "vitality") {
    const milestone = Math.floor(game.score / 50);

    while (game.vitalityMilestone < milestone) {
      game.vitalityMilestone++;
      player.hp++;
      player.damage++;
      createParticles(player.x, player.y, "#62e6a5", 12);
    }
  }

  if (game.skill === "rapid") {
    const milestone = Math.floor(game.score / 300);

    while (game.rapidActivated < milestone) {
      game.rapidActivated++;
      player.fireRate /= 2;
      game.spawnMultiplier = (game.spawnMultiplier || 1) * 2;
      game.enemyCapIncrease = (game.enemyCapIncrease || 0) + 1;
      createParticles(player.x, player.y, "#ffd166", 30);
    }
  }
}

function checkForUpgrade() {
  if (!paused && game.score >= game.nextUpgrade) {
    paused = true;
    upgradeScreen.classList.remove("hidden");
  }
}

function chooseUpgrade(type) {
  if (type === "damage") {
    player.damage += 5;
    createParticles(player.x, player.y, "#ffbd69", 25);
  }

  if (type === "bullets") {
    player.bulletCount++;
    createParticles(player.x, player.y, "#72d6ff", 25);
  }

  if (type === "health") {
    player.hp += 10;
    player.maxHp += 10;
    createParticles(player.x, player.y, "#62e6a5", 25);
  }

  game.nextUpgrade += 1000;
  paused = false;
  upgradeScreen.classList.add("hidden");
  updateHud();
}

function updateEnemies(dt) {
  for (const enemy of enemies) {
    const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);

    enemy.x += Math.cos(angle) * enemy.speed * dt;
    enemy.y += Math.sin(angle) * enemy.speed * dt;
    enemy.hitFlash = Math.max(0, enemy.hitFlash - dt);

    const distance = Math.hypot(player.x - enemy.x, player.y - enemy.y);

    if (distance < player.radius + enemy.radius) {
      player.hp -= enemy.damage * dt * 1.8;
      enemy.x -= Math.cos(angle) * 25 * dt;
      enemy.y -= Math.sin(angle) * 25 * dt;

      if (player.hp <= 0) {
        player.hp = 0;
        endGame();
        return;
      }
    }
  }
}

function updateSpawning(dt) {
  game.nextSpawn -= dt;

  if (game.nextSpawn <= 0) {
    const count = Math.min(5, 1 + Math.floor(elapsed / 35));
    const maxEnemies = 100 + game.enemyCapIncrease;

    for (let i = 0; i < count && enemies.length < maxEnemies; i++) {
      spawnEnemy();
    }

    const baseSpawnRate = Math.max(.22, .95 - elapsed / 900);
    game.nextSpawn = baseSpawnRate / game.spawnMultiplier;
  }
}

function createParticles(x, y, color, amount) {
  for (let i = 0; i < amount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 30 + Math.random() * 130;

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: .35 + Math.random() * .4,
      maxLife: .75,
      color
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const particle = particles[i];

    particle.x += particle.vx * dt;
    particle.y += particle.vy * dt;
    particle.vx *= .96;
    particle.vy *= .96;
    particle.life -= dt;

    if (particle.life <= 0) particles.splice(i, 1);
  }
}

function drawBackground() {
  ctx.fillStyle = "#111622";
  ctx.fillRect(0, 0, width, height);

  ctx.strokeStyle = "rgba(150,180,220,.07)";
  for (let x = 0; x < width; x += 48) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
  }

  for (let y = 0; y < height; y += 48) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }
}

function drawPlayer() {
  ctx.save();
  ctx.shadowColor = "#62e6a5";
  ctx.shadowBlur = 18;
  ctx.fillStyle = "#62e6a5";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  const barWidth = 52;
  const ratio = Math.max(0, player.hp / Math.max(player.maxHp, 10));

  ctx.fillStyle = "#000a";
  ctx.fillRect(player.x - barWidth / 2, player.y - 29, barWidth, 5);

  ctx.fillStyle = ratio > .35 ? "#62e6a5" : "#ff5d73";
  ctx.fillRect(player.x - barWidth / 2, player.y - 29, barWidth * Math.min(1, ratio), 5);
}

function drawEnemies() {
  for (const enemy of enemies) {
    ctx.save();
    ctx.shadowColor = enemy.color;
    ctx.shadowBlur = enemy.hitFlash > 0 ? 24 : 8;
    ctx.fillStyle = enemy.hitFlash > 0 ? "#fff" : enemy.color;

    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const barWidth = enemy.radius * 2.2;
    const ratio = Math.max(0, enemy.hp / enemy.maxHp);

    ctx.fillStyle = "#000a";
    ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemy.radius - 9, barWidth, 4);

    ctx.fillStyle = enemy.color;
    ctx.fillRect(
      enemy.x - barWidth / 2,
      enemy.y - enemy.radius - 9,
      barWidth * ratio,
      4
    );
  }
}

function drawBullets() {
  for (const bullet of bullets) {
    ctx.fillStyle = bullet.color;
    ctx.shadowColor = bullet.color;
    ctx.shadowBlur = 12;

    ctx.beginPath();
    ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
  }
}

function drawParticles() {
  for (const particle of particles) {
    ctx.globalAlpha = Math.max(0, particle.life / particle.maxLife);
    ctx.fillStyle = particle.color;
    ctx.beginPath();
    ctx.arc(particle.x, particle.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
}

function draw() {
  drawBackground();
  drawParticles();
  drawBullets();
  drawEnemies();
  drawPlayer();
}

function loop(now) {
  if (!running) return;

  if (!paused) {
    const dt = Math.min((now - lastTime) / 1000, .05);
    elapsed += dt;

    updatePlayer(dt);
    updateSpawning(dt);
    updateBullets(dt);
    updateEnemies(dt);
    updateParticles(dt);
    updateHud();
  }

  lastTime = now;
  draw();
  animationId = requestAnimationFrame(loop);
}

addEventListener("resize", resize);

addEventListener("keydown", event => {
  keys[event.key.toLowerCase()] = true;

  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "]
    .includes(event.key.toLowerCase())) {
    event.preventDefault();
  }
});

addEventListener("keyup", event => {
  keys[event.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", event => {
  mouse.x = event.clientX;
  mouse.y = event.clientY;
});

document.querySelectorAll("[data-skill]").forEach(button => {
  button.addEventListener("click", () => resetGame(button.dataset.skill));
});

document.querySelectorAll("[data-upgrade]").forEach(button => {
  button.addEventListener("click", () => chooseUpgrade(button.dataset.upgrade));
});

document.getElementById("restartButton").addEventListener("click", () => {
  gameOverScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
});

resize();
</script>
</body>
</html>
