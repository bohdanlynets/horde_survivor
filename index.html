<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horde Survivor</title>
  <style>
    :root {
      --bg: #10131b;
      --panel: rgba(15, 18, 28, 0.92);
      --text: #f4f7ff;
      --muted: #aab3c7;
      --accent: #62e6a5;
      --danger: #ff5d73;
      --gold: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      background:
        radial-gradient(circle at center, #20283a 0%, #111622 65%, #0c0f16 100%);
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 12, 0.8);
      z-index: 10;
    }

    .panel {
      width: min(920px, calc(100% - 32px));
      padding: 28px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 70px rgba(0,0,0,.45);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 4rem);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 24px rgba(98,230,165,.35);
    }

    h2 { margin: 0 0 20px; }

    p { color: var(--muted); }

    .skills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 24px;
    }

    .skill {
      min-height: 190px;
      padding: 20px;
      color: var(--text);
      text-align: left;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px;
      background: linear-gradient(145deg, #20283b, #151a28);
      cursor: pointer;
      transition: transform .18s, border-color .18s, background .18s;
    }

    .skill:hover,
    .skill:focus {
      transform: translateY(-5px);
      border-color: var(--accent);
      background: linear-gradient(145deg, #29394b, #17242c);
      outline: none;
    }

    .skill strong {
      display: block;
      margin-bottom: 12px;
      color: var(--gold);
      font-size: 1.15rem;
    }

    .skill span {
      display: block;
      color: var(--muted);
      line-height: 1.5;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 9px;
      color: #08110d;
      background: var(--accent);
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.1); }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 3;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: bold;
      text-shadow: 0 2px 3px #000;
    }

    .hud-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hud-item {
      padding: 8px 11px;
      border-radius: 8px;
      background: rgba(5, 8, 15, .68);
      border: 1px solid rgba(255,255,255,.12);
    }

    #help {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      color: #c5ccdb;
      font-size: 13px;
      text-align: center;
      opacity: .8;
      pointer-events: none;
    }

    .hidden { display: none; }

    @media (max-width: 720px) {
      .skills { grid-template-columns: 1fr; }
      .skill { min-height: 0; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-group">
      <div class="hud-item">HP: <span id="hp">10/10</span></div>
      <div class="hud-item">Score: <span id="score">0</span></div>
      <div class="hud-item">Enemies: <span id="enemyCount">0</span></div>
    </div>
    <div class="hud-group">
      <div class="hud-item">Skill: <span id="skillName">None</span></div>
      <div class="hud-item">Time: <span id="time">0:00</span></div>
    </div>
  </div>

  <div id="help" class="hidden">
    Move with WASD or arrow keys. Aim with the mouse. Your weapon fires automatically.
  </div>

  <section id="startScreen" class="screen">
    <div class="panel">
      <h1>Horde Survivor</h1>
      <p>Choose one starting skill before entering the horde.</p>

      <div class="skills">
        <button class="skill" data-skill="healing">
          <strong>1 — Vitality</strong>
          <span>Every 50 points, gain 1 HP and 1 bullet damage. Your HP can exceed its starting maximum.</span>
        </button>

        <button class="skill" data-skill="rapid">
          <strong>2 — Overclock</strong>
          <span>At 300 points, your weapon's fire rate doubles permanently.</span>
        </button>

        <button class="skill" data-skill="chaos">
          <strong>3 — Chaos Cannon</strong>
          <span>Quadruple fire rate and bullet damage, but every bullet has a random aim deviation.</span>
        </button>
      </div>
    </div>
  </section>

  <section id="gameOverScreen" class="screen hidden">
    <div class="panel">
      <h1>Game Over</h1>
      <h2>Final score: <span id="finalScore">0</span></h2>
      <p id="finalStats"></p>
      <button id="restartButton">Choose Another Skill</button>
    </div>
  </section>

  <script>
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const startScreen = document.getElementById("startScreen");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const hud = document.getElementById("hud");
    const help = document.getElementById("help");

    const hpEl = document.getElementById("hp");
    const scoreEl = document.getElementById("score");
    const enemyCountEl = document.getElementById("enemyCount");
    const skillNameEl = document.getElementById("skillName");
    const timeEl = document.getElementById("time");
    const finalScoreEl = document.getElementById("finalScore");
    const finalStatsEl = document.getElementById("finalStats");
    const restartButton = document.getElementById("restartButton");

    let width = window.innerWidth;
    let height = window.innerHeight;
    let animationId;
    let lastTime = 0;
    let gameRunning = false;
    let elapsed = 0;

    const keys = {};
    const mouse = {
      x: width / 2 + 100,
      y: height / 2,
      active: false
    };

    const bullets = [];
    const enemies = [];
    const particles = [];

    const player = {
      x: width / 2,
      y: height / 2,
      radius: 16,
      speed: 245,
      hp: 10,
      maxHp: 10,
      angle: 0,
      fireCooldown: 0,
      baseFireRate: 0.24,
      bulletDamage: 1
    };

    const game = {
      score: 0,
      kills: 0,
      skill: null,
      nextSpawn: 0,
      rapidActivated: false,
      healingMilestone: 0
    };

    const skillNames = {
      healing: "Vitality",
      rapid: "Overclock",
      chaos: "Chaos Cannon"
    };

    const enemyTypes = {
      small: {
        hp: 2,
        speed: 105,
        radius: 11,
        damage: 1,
        points: 5,
        color: "#72d6ff"
      },
      medium: {
        hp: 6,
        speed: 68,
        radius: 17,
        damage: 1,
        points: 10,
        color: "#ffbd69"
      },
      large: {
        hp: 20,
        speed: 36,
        radius: 27,
        damage: 2,
        points: 20,
        color: "#ff5d73"
      }
    };

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (!gameRunning) {
        player.x = width / 2;
        player.y = height / 2;
      }
    }

    function resetGame(skill) {
      gameRunning = true;
      elapsed = 0;

      game.score = 0;
      game.kills = 0;
      game.skill = skill;
      game.nextSpawn = 0;
      game.rapidActivated = false;
      game.healingMilestone = 0;

      player.x = width / 2;
      player.y = height / 2;
      player.hp = player.maxHp;
      player.fireCooldown = 0;
      player.baseFireRate = 0.24;
      player.bulletDamage = skill === "chaos" ? 4 : 1;

      bullets.length = 0;
      enemies.length = 0;
      particles.length = 0;

      startScreen.classList.add("hidden");
      gameOverScreen.classList.add("hidden");
      hud.classList.remove("hidden");
      help.classList.remove("hidden");

      skillNameEl.textContent = skillNames[skill];
      updateHud();

      lastTime = performance.now();
      cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
      gameRunning = false;
      finalScoreEl.textContent = game.score;
      finalStatsEl.textContent =
        `You survived ${formatTime(elapsed)} and defeated ${game.kills} enemies.`;

      hud.classList.add("hidden");
      help.classList.add("hidden");
      gameOverScreen.classList.remove("hidden");
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${secs}`;
    }

    function updateHud() {
      hpEl.textContent = Math.ceil(Math.max(0, player.hp));
      scoreEl.textContent = game.score;
      enemyCountEl.textContent = enemies.length;
      timeEl.textContent = formatTime(elapsed);
    }

    function randomEdgePosition() {
      const side = Math.floor(Math.random() * 4);
      const margin = 50;

      if (side === 0) return { x: Math.random() * width, y: -margin };
      if (side === 1) return { x: width + margin, y: Math.random() * height };
      if (side === 2) return { x: Math.random() * width, y: height + margin };
      return { x: -margin, y: Math.random() * height };
    }

    function chooseEnemyType() {
      const roll = Math.random();
      const largeChance = Math.min(0.18, elapsed / 2400);
      const mediumChance = Math.min(0.40, 0.30 + elapsed / 1800);

      if (roll < largeChance) return "large";
      if (roll < largeChance + mediumChance) return "medium";
      return "small";
    }

    function spawnEnemy() {
      const type = chooseEnemyType();
      const stats = enemyTypes[type];
      const position = randomEdgePosition();

      enemies.push({
        type,
        x: position.x,
        y: position.y,
        hp: stats.hp,
        maxHp: stats.hp,
        speed: stats.speed * (1 + elapsed / 6000),
        radius: stats.radius,
        damage: stats.damage,
        points: stats.points,
        color: stats.color,
        hitFlash: 0
      });
    }

    function getFireRate() {
      let rate = player.baseFireRate;

      if (game.skill === "rapid" && game.rapidActivated) {
        rate /= 2;
      }

      if (game.skill === "chaos") {
        rate /= 4;
      }

      return rate;
    }

    function getAutoAimTarget() {
      if (enemies.length === 0) return null;

      if (game.skill === "chaos") {
        return enemies[Math.floor(Math.random() * enemies.length)];
      }

      let closestEnemy = null;
      let closestDistance = Infinity;

      for (const enemy of enemies) {
        const distance = Math.hypot(enemy.x - player.x, enemy.y - player.y);
        if (distance < closestDistance) {
          closestDistance = distance;
          closestEnemy = enemy;
        }
      }

      return closestEnemy;
    }

    function shoot() {
  let angle;

  if (game.skill === "chaos") {

    angle = Math.random() * Math.PI * 2;
  } else {

    const target = getAutoAimTarget();

    if (target) {
      angle = Math.atan2(
        target.y - player.y,
        target.x - player.x
      );
    } else {
      angle = Math.random() * Math.PI * 2;
    }
  }

  const bulletSpeed = 720;

  bullets.push({
    x: player.x + Math.cos(angle) * 22,
    y: player.y + Math.sin(angle) * 22,
    vx: Math.cos(angle) * bulletSpeed,
    vy: Math.sin(angle) * bulletSpeed,
    radius: game.skill === "chaos" ? 5 : 4,
    damage: player.bulletDamage,
    life: 1.2,
    color: game.skill === "chaos" ? "#ff5cff" : "#f7f2b0"
  });
}

    function updatePlayer(dt) {
      let dx = 0;
      let dy = 0;

      if (keys.w || keys.arrowup) dy -= 1;
      if (keys.s || keys.arrowdown) dy += 1;
      if (keys.a || keys.arrowleft) dx -= 1;
      if (keys.d || keys.arrowright) dx += 1;

      if (dx || dy) {
        const length = Math.hypot(dx, dy);
        player.x += (dx / length) * player.speed * dt;
        player.y += (dy / length) * player.speed * dt;
      }

      player.x = Math.max(player.radius, Math.min(width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(height - player.radius, player.y));

      player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

      player.fireCooldown -= dt;
      if (player.fireCooldown <= 0) {
        shoot();
        player.fireCooldown = getFireRate();
      }
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];

        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
        bullet.life -= dt;

        if (
          bullet.life <= 0 ||
          bullet.x < -30 ||
          bullet.x > width + 30 ||
          bullet.y < -30 ||
          bullet.y > height + 30
        ) {
          bullets.splice(i, 1);
          continue;
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          const distance = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);

          if (distance < bullet.radius + enemy.radius) {
            enemy.hp -= bullet.damage;
            enemy.hitFlash = 0.08;
            bullets.splice(i, 1);

            createParticles(bullet.x, bullet.y, enemy.color, 4);

            if (enemy.hp <= 0) {
              game.score += enemy.points;
              game.kills++;

              createParticles(enemy.x, enemy.y, enemy.color, 16);

              enemies.splice(j, 1);
              applyScoreSkills();
            }

            break;
          }
        }
      }
    }

    function applyScoreSkills() {
  if (game.skill === "healing") {
    const newMilestone = Math.floor(game.score / 50);

    while (game.healingMilestone < newMilestone) {
      game.healingMilestone++;

      player.hp += 1;

      player.bulletDamage += 1;

      createParticles(player.x, player.y, "#62e6a5", 12);
    }
  }

  if (game.skill === "rapid" && !game.rapidActivated && game.score >= 300) {
    game.rapidActivated = true;
    createParticles(player.x, player.y, "#ffd166", 30);
  }
}

    function updateEnemies(dt) {
      for (const enemy of enemies) {
        const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
        enemy.x += Math.cos(angle) * enemy.speed * dt;
        enemy.y += Math.sin(angle) * enemy.speed * dt;
        enemy.hitFlash = Math.max(0, enemy.hitFlash - dt);

        const distance = Math.hypot(player.x - enemy.x, player.y - enemy.y);

        if (distance < player.radius + enemy.radius) {
          player.hp -= enemy.damage * dt * 1.8;

          enemy.x -= Math.cos(angle) * 25 * dt;
          enemy.y -= Math.sin(angle) * 25 * dt;

          if (player.hp <= 0) {
            player.hp = 0;
            endGame();
            return;
          }
        }
      }
    }

    function updateSpawning(dt) {
      game.nextSpawn -= dt;

      if (game.nextSpawn <= 0) {
        const spawnCount = Math.min(5, 1 + Math.floor(elapsed / 35));

        for (let i = 0; i < spawnCount; i++) {
          spawnEnemy();
        }

        game.nextSpawn = Math.max(0.22, 0.95 - elapsed / 900);
      }
    }

    function createParticles(x, y, color, amount) {
      for (let i = 0; i < amount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 30 + Math.random() * 130;

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.35 + Math.random() * 0.4,
          maxLife: 0.75,
          color
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const particle = particles[i];

        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vx *= 0.96;
        particle.vy *= 0.96;
        particle.life -= dt;

        if (particle.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#111622";
      ctx.fillRect(0, 0, width, height);

      const gridSize = 48;
      ctx.strokeStyle = "rgba(150, 180, 220, 0.07)";
      ctx.lineWidth = 1;

      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
    }

    function drawPlayer() {
  ctx.save();

  ctx.shadowColor = "#62e6a5";
  ctx.shadowBlur = 18;

  ctx.fillStyle = "#62e6a5";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // HP bar
  const barWidth = 48;
  const hpRatio = Math.max(0, player.hp / player.maxHp);

  ctx.fillStyle = "rgba(0, 0, 0, .65)";
  ctx.fillRect(
    player.x - barWidth / 2,
    player.y - 29,
    barWidth,
    5
  );

  ctx.fillStyle = hpRatio > 0.35 ? "#62e6a5" : "#ff5d73";
  ctx.fillRect(
    player.x - barWidth / 2,
    player.y - 29,
    barWidth * hpRatio,
    5
  );
}

    function drawEnemies() {
      for (const enemy of enemies) {
        ctx.save();

        ctx.shadowColor = enemy.color;
        ctx.shadowBlur = enemy.hitFlash > 0 ? 24 : 8;

        ctx.fillStyle = enemy.hitFlash > 0 ? "#ffffff" : enemy.color;
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(10, 12, 18, .6)";
        ctx.beginPath();
        ctx.arc(enemy.x - enemy.radius * .28, enemy.y - 2, 3, 0, Math.PI * 2);
        ctx.arc(enemy.x + enemy.radius * .28, enemy.y - 2, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        const barWidth = enemy.radius * 2.2;
        const ratio = Math.max(0, enemy.hp / enemy.maxHp);

        ctx.fillStyle = "rgba(0,0,0,.65)";
        ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemy.radius - 9, barWidth, 4);

        ctx.fillStyle = enemy.color;
        ctx.fillRect(enemy.x - barWidth / 2, enemy.y - enemy.radius - 9, barWidth * ratio, 4);
      }
    }

    function drawBullets() {
      for (const bullet of bullets) {
        ctx.fillStyle = bullet.color;
        ctx.shadowColor = bullet.color;
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
      }
    }

    function drawParticles() {
      for (const particle of particles) {
        ctx.globalAlpha = Math.max(0, particle.life / particle.maxLife);
        ctx.fillStyle = particle.color;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
    }

    function draw() {
      drawBackground();
      drawParticles();
      drawBullets();
      drawEnemies();
      drawPlayer();
    }

    function gameLoop(now) {
      if (!gameRunning) return;

      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      elapsed += dt;

      updatePlayer(dt);
      updateSpawning(dt);
      updateBullets(dt);
      updateEnemies(dt);
      updateParticles(dt);

      draw();
      updateHud();

      if (gameRunning) {
        animationId = requestAnimationFrame(gameLoop);
      }
    }

    window.addEventListener("resize", resizeCanvas);

    window.addEventListener("keydown", event => {
      keys[event.key.toLowerCase()] = true;

      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
    });

    window.addEventListener("keyup", event => {
      keys[event.key.toLowerCase()] = false;
    });

    canvas.addEventListener("mousemove", event => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
      mouse.active = true;
    });

    canvas.addEventListener("touchmove", event => {
      const touch = event.touches[0];
      if (!touch) return;

      mouse.x = touch.clientX;
      mouse.y = touch.clientY;
      mouse.active = true;
    }, { passive: true });

    document.querySelectorAll(".skill").forEach(button => {
      button.addEventListener("click", () => {
        resetGame(button.dataset.skill);
      });
    });

    restartButton.addEventListener("click", () => {
      gameOverScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });

    resizeCanvas();
  </script>
</body>
</html>
